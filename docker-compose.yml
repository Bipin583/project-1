version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conftest-api
    ports:
      - "8000:8000"
    environment:
      - CONFTEST_ENV=production
      - CONFTEST_API_HOST=0.0.0.0
      - CONFTEST_API_PORT=8000
      - CONFTEST_DATABASE_URL=sqlite:///./data/conftest.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: uvicorn conftest.api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conftest-dashboard
    ports:
      - "8501:8501"
    environment:
      - CONFTEST_ENV=production
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - api
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
